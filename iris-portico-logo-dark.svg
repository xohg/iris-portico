<svg width="400" height="420" viewBox="0 0 400 420" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="gFrame" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2E9BFF"/>
      <stop offset="1" stop-color="#2ED4A8"/>
    </linearGradient>
    <linearGradient id="gText" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2E9BFF"/>
      <stop offset="1" stop-color="#2ED4A8"/>
    </linearGradient>
  </defs>

  <!-- 深色背景（直角，棱角风格） -->
  <rect x="10" y="10" width="380" height="400" fill="#0B1F3A"/>

  <!-- 图形标志 -->
  <g transform="translate(80,20)">
    <polygon points="50,75 120,25 190,75 190,215 50,215"
             fill="none" stroke="url(#gFrame)" stroke-width="10" stroke-linejoin="miter"/>
    <polygon points="120,38 132,52 120,66 108,52" fill="url(#gFrame)"/>
    <line x1="34" y1="215" x2="206" y2="215" stroke="url(#gFrame)" stroke-width="10"/>
    <line x1="50" y1="232" x2="190" y2="232" stroke="url(#gFrame)" stroke-width="6" opacity="0.55"/>

    <g>
      <polygon points="120,92 108,140 132,140" fill="#2E9BFF"/>
      <polygon points="120,92 108,140 132,140" fill="#2ED4A8" transform="rotate(60 120 140)"/>
      <polygon points="120,92 108,140 132,140" fill="#2E9BFF" transform="rotate(120 120 140)"/>
      <polygon points="120,92 108,140 132,140" fill="#2ED4A8" transform="rotate(180 120 140)"/>
      <polygon points="120,92 108,140 132,140" fill="#2E9BFF" transform="rotate(240 120 140)"/>
      <polygon points="120,92 108,140 132,140" fill="#2ED4A8" transform="rotate(300 120 140)"/>
    </g>
    <polygon points="120,126 134,140 120,154 106,140" fill="#A5F3EB"/>
  </g>

  <!-- 文字标识 -->
  <text x="200" y="330" text-anchor="middle"
        font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif"
        font-size="38" font-weight="700" letter-spacing="4"
        fill="url(#gText)">IRIS PORTICO</text>
  <text x="200" y="368" text-anchor="middle"
        font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif"
        font-size="15" font-weight="500" letter-spacing="5"
        fill="#4FC3E8">MANAGEMENT PORTAL</text>
</svg>
