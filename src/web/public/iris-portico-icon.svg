<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="gFrame" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0077C8"/>
      <stop offset="1" stop-color="#00B388"/>
    </linearGradient>
  </defs>

  <!-- 门廊框架：五边形（尖顶），棱角分明 -->
  <polygon points="50,75 120,25 190,75 190,215 50,215"
           fill="none" stroke="url(#gFrame)" stroke-width="10" stroke-linejoin="miter"/>
  <!-- 拱心石：顶部菱形 -->
  <polygon points="120,38 132,52 120,66 108,52" fill="url(#gFrame)"/>
  <!-- 基座：双层棱角横线 -->
  <line x1="34" y1="215" x2="206" y2="215" stroke="url(#gFrame)" stroke-width="10"/>
  <line x1="50" y1="232" x2="190" y2="232" stroke="url(#gFrame)" stroke-width="6" opacity="0.55"/>

  <!-- 几何鸢尾：6 片尖锐三角花瓣，蓝绿交替，绕中心 (120,140) -->
  <g>
    <polygon points="120,92 108,140 132,140" fill="#0077C8"/>
    <polygon points="120,92 108,140 132,140" fill="#00B388" transform="rotate(60 120 140)"/>
    <polygon points="120,92 108,140 132,140" fill="#0077C8" transform="rotate(120 120 140)"/>
    <polygon points="120,92 108,140 132,140" fill="#00B388" transform="rotate(180 120 140)"/>
    <polygon points="120,92 108,140 132,140" fill="#0077C8" transform="rotate(240 120 140)"/>
    <polygon points="120,92 108,140 132,140" fill="#00B388" transform="rotate(300 120 140)"/>
  </g>
  <!-- 花心：菱形（浅青色，深浅主题均清晰） -->
  <polygon points="120,126 134,140 120,154 106,140" fill="#7EE8E0"/>
</svg>
