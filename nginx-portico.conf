# IRIS Portico — nginx front-end server.
#
# Serves the built Angular SPA (static files from /irisdev/web) on port 80 and
# proxies the IRIS SysAdmin API (/api/admin) to the built-in IRIS web server on
# 127.0.0.1:52773. Because the frontend and the API share the same origin
# (port 80), the frontend can call /api/admin directly with no CORS issues,
# using Basic auth. This decouples frontend delivery from IRIS web-app
# registration — the portal works even if the BFF web app never loads.
server {
    listen 80;
    server_name _;

    root /irisdev/web;
    index index.html;

    # Content-hashed static assets (Angular names every chunk with a content
    # hash, e.g. chunk-ABC123.js): a new build produces NEW names, so these are
    # safe to cache forever — the browser never serves a stale one.
    location ~* \.(js|css|png|jpg|jpeg|gif|svg|ico|woff|woff2)$ {
        add_header Cache-Control "max-age=31536000, immutable";
    }

    # Everything else — index.html and the SPA fallback — is NEVER cached, so a
    # plain browser refresh always revalidates and picks up the latest chunk
    # manifest. (Without this, a cached index.html would keep referencing old
    # chunk names and the user would run a stale build.)
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }

    # Proxy the IRIS SysAdmin API to the built-in IRIS web server.
    # No-URI proxy_pass forwards the original request path verbatim, so
    # /api/admin/info -> http://127.0.0.1:52773/api/admin/info.
    location /api/admin {
        proxy_pass http://127.0.0.1:52773;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
